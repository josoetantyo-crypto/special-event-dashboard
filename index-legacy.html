<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 SPECIAL EVENT — IgniteX</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
:root {
  --white: #FFFFFF;
  --black: #0A0A0A;
  --red: #D40000;
  --red-hover: #FF0000;
  --gray-50: #FAFAFA;
  --gray-100: #F4F4F4;
  --gray-200: #E8E8E8;
  --gray-300: #D0D0D0;
  --gray-400: #A0A0A0;
  --gray-600: #666666;
  --done-border: #D0D0D0;
  --done-text: #999999;
  --done-bg: #F8F8F8;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',system-ui,sans-serif; background:var(--white); color:var(--black); min-height:100vh; }

/* ═══ HEADER ═══ */
header { background:var(--black); position:sticky; top:0; z-index:100; }
.header-inner { max-width:1440px; margin:0 auto; padding:0 32px; display:flex; align-items:center; justify-content:space-between; height:72px; gap:20px; }
.brand { display:flex; align-items:center; gap:14px; }
.brand-mark { background:var(--red); color:var(--white); font-size:15px; font-weight:900; letter-spacing:-0.5px; padding:6px 10px; border-radius:4px; line-height:1; }
.brand-text { color:var(--white); }
.brand-title { font-size:13px; font-weight:700; letter-spacing:2px; text-transform:uppercase; }
.brand-year { font-size:10px; color:var(--gray-400); letter-spacing:1px; text-transform:uppercase; margin-top:1px; }
.header-stats { display:flex; align-items:center; gap:28px; }
.hstat { text-align:center; }
.hstat-num { font-size:20px; font-weight:800; color:var(--white); line-height:1; }
.hstat-num.red { color:var(--red); }
.hstat-num.gray { color:var(--gray-400); }
.hstat-label { font-size:9px; color:var(--gray-400); text-transform:uppercase; letter-spacing:1px; margin-top:2px; }
.header-right { display:flex; align-items:center; gap:10px; }
.search-wrap { position:relative; }
.search-wrap svg { position:absolute; left:10px; top:50%; transform:translateY(-50%); opacity:.4; pointer-events:none; }
.search { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.15); border-radius:6px; padding:8px 12px 8px 34px; color:var(--white); font-size:12px; font-family:inherit; width:200px; outline:none; transition:all .2s; }
.search:focus { background:rgba(255,255,255,.15); border-color:rgba(255,255,255,.35); }
.search::placeholder { color:rgba(255,255,255,.35); }
.hbtn { background:transparent; border:1px solid rgba(255,255,255,.2); color:rgba(255,255,255,.7); padding:7px 14px; border-radius:6px; font-size:11px; font-weight:600; font-family:inherit; letter-spacing:.5px; cursor:pointer; transition:all .2s; text-transform:uppercase; }
.hbtn:hover { background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.4); color:var(--white); }
.hbtn-red { background:var(--red); border-color:var(--red); color:var(--white); }
.hbtn-red:hover { background:var(--red-hover); border-color:var(--red-hover); color:var(--white); }

/* ═══ PROGRESS BAR ═══ */
.progress-strip { height:3px; background:rgba(255,255,255,.08); }
.progress-fill { height:100%; background:var(--red); transition:width .8s ease; }

/* ═══ TIMELINE STRIP ═══ */
.timeline-strip { background:var(--black); border-bottom:2px solid var(--red); padding:0 32px; overflow-x:auto; scrollbar-width:none; }
.timeline-strip::-webkit-scrollbar { display:none; }
.timeline-inner { max-width:1440px; margin:0 auto; display:flex; align-items:stretch; gap:0; min-width:700px; }
.tq-group { display:flex; align-items:stretch; border-right:1px solid rgba(255,255,255,.1); }
.tq-group:last-child { border-right:none; }
.tq-label { writing-mode:vertical-rl; transform:rotate(180deg); font-size:9px; font-weight:800; letter-spacing:2px; color:var(--red); text-transform:uppercase; padding:12px 10px 12px 6px; border-right:1px solid rgba(255,255,255,.08); flex-shrink:0; }
.tmonths { display:flex; }
.tmonth { padding:10px 14px; cursor:pointer; font-size:10px; font-weight:700; color:rgba(255,255,255,.4); text-transform:uppercase; letter-spacing:1.5px; border:none; background:none; font-family:inherit; transition:all .2s; position:relative; white-space:nowrap; }
.tmonth:hover { color:var(--white); }
.tmonth.active { color:var(--white); }
.tmonth.active::after { content:''; position:absolute; bottom:0; left:8px; right:8px; height:2px; background:var(--red); }
.tmonth .dot-count { display:block; width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.2); margin:3px auto 0; }
.tmonth.active .dot-count,
.tmonth:hover .dot-count { background:var(--red); }
.tmonth.has-events .dot-count { background:rgba(255,100,100,.5); }

/* ═══ FILTER BAR ═══ */
.filter-bar { background:var(--white); border-bottom:1px solid var(--gray-200); padding:0 32px; position:sticky; top:64px; z-index:90; }
.filter-inner { max-width:1440px; margin:0 auto; display:flex; align-items:center; gap:8px; height:48px; flex-wrap:wrap; overflow:hidden; }
.filter-divider { width:1px; height:20px; background:var(--gray-200); margin:0 4px; flex-shrink:0; }
.fc { padding:5px 14px; border-radius:100px; border:1px solid var(--gray-200); background:var(--white); color:var(--gray-600); font-size:11px; font-weight:600; font-family:inherit; letter-spacing:.5px; text-transform:uppercase; cursor:pointer; transition:all .18s; white-space:nowrap; }
.fc:hover { border-color:var(--black); color:var(--black); }
.fc.active { background:var(--black); border-color:var(--black); color:var(--white); }
.fc.active-red { background:var(--red); border-color:var(--red); color:var(--white); }
.filter-right { margin-left:auto; display:flex; align-items:center; gap:8px; flex-shrink:0; }
.count-text { font-size:11px; color:var(--gray-400); letter-spacing:.5px; white-space:nowrap; }
.sort-sel { border:1px solid var(--gray-200); border-radius:6px; padding:5px 10px; font-size:11px; font-family:inherit; background:var(--white); color:var(--gray-600); cursor:pointer; outline:none; }

/* ═══ MAIN ═══ */
main { max-width:1440px; margin:0 auto; padding:32px 32px 64px; }

/* ═══ QUARTER HEADER ═══ */
.q-section { margin-bottom:40px; }
.q-header { display:flex; align-items:center; gap:16px; margin-bottom:20px; padding:14px 20px; background:var(--black); border-radius:8px; }
.q-num { font-size:28px; font-weight:900; color:var(--red); letter-spacing:-1px; line-height:1; flex-shrink:0; }
.q-detail { flex:1; }
.q-period { font-size:11px; font-weight:700; color:rgba(255,255,255,.5); text-transform:uppercase; letter-spacing:2px; margin-bottom:2px; }
.q-title { font-size:15px; font-weight:700; color:var(--white); }
.q-right { display:flex; align-items:center; gap:10px; flex-shrink:0; }
.q-badge { font-size:10px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; padding:4px 12px; border-radius:100px; }
.q-badge-total { background:rgba(255,255,255,.1); color:rgba(255,255,255,.7); }
.q-badge-done { background:rgba(212,0,0,.3); color:#FF6666; }

/* ═══ EVENT GRID ═══ */
.event-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }

/* ═══ EVENT CARD ═══ */
.ecard { background:var(--white); border:1px solid var(--gray-200); border-radius:8px; padding:18px; cursor:pointer; transition:all .2s; position:relative; overflow:hidden; }
.ecard::before { content:''; position:absolute; top:0; left:0; width:3px; height:100%; background:var(--gray-200); transition:background .2s; }
.ecard.upcoming::before { background:#16a34a; }
.ecard.upcoming.grp-ignite::before { background:var(--red); }
.ecard.upcoming.grp-connect::before { background:var(--black); }
.ecard.upcoming.grp-none::before { background:#16a34a; }
.ecard.done::before { background:var(--gray-300); }
.ecard:hover { border-color:var(--black); box-shadow:0 4px 20px rgba(0,0,0,.08); transform:translateY(-1px); }
.ecard:hover::before { background:#16a34a; }
.ecard.grp-ignite:hover::before { background:var(--red); }
.ecard.grp-connect:hover::before { background:var(--black); }
/* Group badge */
.gbadge { display:inline-flex; align-items:center; gap:4px; font-size:9px; font-weight:800; letter-spacing:1px; text-transform:uppercase; padding:3px 9px; border-radius:100px; cursor:default; }
.gbadge::before { content:''; display:inline-block; width:5px; height:5px; border-radius:50%; flex-shrink:0; }
.gbadge-ignite { background:rgba(212,0,0,.1); color:var(--red); border:1px solid rgba(212,0,0,.25); }
.gbadge-ignite::before { background:var(--red); }
.gbadge-connect { background:rgba(10,10,10,.08); color:var(--black); border:1px solid rgba(10,10,10,.18); }
.gbadge-connect::before { background:var(--black); }
.gbadge-none { background:var(--gray-100); color:var(--gray-400); border:1px solid var(--gray-200); }
.gbadge-none::before { background:var(--gray-300); }
/* Momentum on card */
.ecard-momentum { font-size:11px; font-weight:600; color:var(--red); background:rgba(212,0,0,.06); border-left:2px solid var(--red); padding:6px 10px; border-radius:0 5px 5px 0; margin-bottom:10px; line-height:1.5; }
.ecard.done .ecard-momentum { color:var(--gray-400); background:var(--gray-100); border-left-color:var(--gray-300); }
/* Momentum textarea in modal */
.momentum-ta { width:100%; border:1.5px dashed var(--gray-300); border-radius:8px; padding:10px 13px; font-size:13px; font-family:inherit; color:var(--black); background:rgba(212,0,0,.03); outline:none; resize:vertical; min-height:72px; line-height:1.6; transition:all .2s; margin-bottom:4px; }
.momentum-ta:focus { border-color:var(--red); border-style:solid; background:var(--white); }
.momentum-ta::placeholder { color:var(--gray-400); }
.momentum-hint { font-size:10px; color:var(--gray-400); margin-bottom:20px; }
/* Quick-assign group selector in modal */
.group-assign { display:flex; align-items:center; gap:10px; background:var(--gray-50); border:1px solid var(--gray-200); border-radius:8px; padding:10px 14px; margin-bottom:18px; }
.group-assign-label { font-size:10px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase; color:var(--gray-400); flex-shrink:0; }
.group-sel { border:1px solid var(--gray-200); border-radius:6px; padding:6px 10px; font-size:12px; font-weight:600; font-family:inherit; background:var(--white); color:var(--black); cursor:pointer; outline:none; transition:border-color .2s; }
.group-sel:focus { border-color:var(--black); }
.ecard-head { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; }
.ecard-date { display:flex; flex-direction:column; }
.ecard-day { font-size:28px; font-weight:900; color:var(--black); line-height:1; letter-spacing:-1px; }
.ecard.done .ecard-day { color:var(--gray-400); }
.ecard-month { font-size:10px; font-weight:700; color:var(--gray-400); letter-spacing:2px; text-transform:uppercase; margin-top:1px; }
.estatus { font-size:9px; font-weight:800; letter-spacing:1px; text-transform:uppercase; padding:3px 10px; border-radius:100px; }
.estatus.upcoming { background:rgba(22,163,74,.12); color:#16a34a; border:1px solid rgba(22,163,74,.25); }
.estatus.done { background:var(--gray-100); color:var(--gray-400); border:1px solid var(--gray-200); }
.ecard-name { font-size:14px; font-weight:700; color:var(--black); line-height:1.4; margin-bottom:10px; }
.ecard.done .ecard-name { color:var(--gray-600); }
.ecard-foot { display:flex; align-items:center; justify-content:space-between; padding-top:10px; border-top:1px solid var(--gray-100); }
.ecard-tags { display:flex; gap:5px; flex-wrap:wrap; }
.etag { font-size:9px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; padding:3px 9px; border-radius:4px; white-space:nowrap; }
.etag-cat { background:var(--gray-100); color:var(--gray-600); }
.etag-cat.bop { background:rgba(212,0,0,.08); color:var(--red); }
.etag-cat.major { background:var(--black); color:var(--white); }
.etag-cat.trip { background:rgba(212,0,0,.08); color:var(--red); }
.etag-cat.summit { background:var(--black); color:var(--white); }
.etag-cat.core { background:rgba(212,0,0,.08); color:var(--red); }
.etag-pic { font-size:9px; font-weight:600; color:var(--gray-400); align-self:center; white-space:nowrap; }

/* ═══ MONTH DIVIDER ═══ */
.month-divider { display:flex; align-items:center; gap:12px; margin:24px 0 12px; }
.month-name { font-size:11px; font-weight:800; letter-spacing:3px; text-transform:uppercase; color:var(--black); white-space:nowrap; }
.month-line { flex:1; height:1px; background:var(--gray-200); }
.month-count { font-size:10px; font-weight:600; color:var(--gray-400); white-space:nowrap; }

/* ═══ MODAL ═══ */
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:200; display:flex; align-items:center; justify-content:center; padding:24px; opacity:0; pointer-events:none; transition:opacity .2s; backdrop-filter:blur(2px); }
.overlay.open { opacity:1; pointer-events:all; }
.modal { background:var(--white); border-radius:12px; width:100%; max-width:680px; max-height:88vh; overflow-y:auto; transform:translateY(16px) scale(.98); transition:transform .22s; box-shadow:0 24px 60px rgba(0,0,0,.25); }
.overlay.open .modal { transform:translateY(0) scale(1); }
.modal-hdr { padding:0 0 0; border-bottom:1px solid var(--gray-200); position:sticky; top:0; background:var(--white); z-index:10; border-radius:12px 12px 0 0; overflow:hidden; }
.modal-accent { height:4px; background:var(--red); }
.modal-hdr-inner { padding:20px 24px 16px; display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
.mcat { font-size:9px; font-weight:800; letter-spacing:2px; text-transform:uppercase; color:var(--red); margin-bottom:5px; }
.mname { font-size:20px; font-weight:800; color:var(--black); line-height:1.3; }
.m-close { background:var(--gray-100); border:none; border-radius:6px; color:var(--gray-600); cursor:pointer; font-size:16px; padding:6px 10px; line-height:1; transition:all .2s; flex-shrink:0; margin-top:2px; }
.m-close:hover { background:var(--gray-200); color:var(--black); }
.modal-tags { padding:0 24px 16px; display:flex; flex-wrap:wrap; gap:6px; }
.mtag { font-size:10px; font-weight:600; color:var(--gray-600); background:var(--gray-100); padding:4px 12px; border-radius:100px; border:1px solid var(--gray-200); }
.mstatus-tag.upcoming { background:rgba(212,0,0,.1); color:var(--red); border-color:rgba(212,0,0,.2); }
.mstatus-tag.done { background:var(--gray-100); color:var(--gray-400); border-color:var(--gray-200); }
.modal-body { padding:20px 24px 24px; }
.m-sec { font-size:9px; font-weight:800; letter-spacing:2px; color:var(--gray-400); text-transform:uppercase; margin:0 0 10px; display:flex; align-items:center; gap:10px; }
.m-sec::after { content:''; flex:1; height:1px; background:var(--gray-200); }
.m-desc { font-size:13px; color:var(--gray-600); line-height:1.7; background:var(--gray-50); border:1px solid var(--gray-200); border-radius:8px; padding:14px 16px; margin-bottom:20px; }
.m-list { list-style:none; margin-bottom:20px; }
.m-list li { display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--gray-100); font-size:12px; color:var(--gray-600); line-height:1.6; }
.m-list li:last-child { border-bottom:none; }
.m-num { color:var(--red); font-weight:800; flex-shrink:0; min-width:16px; }
.m-note { background:var(--gray-50); border-left:3px solid var(--red); border-radius:0 6px 6px 0; padding:12px 14px; font-size:12px; color:var(--gray-600); line-height:1.6; }
.modal-ftr { padding:14px 24px; border-top:1px solid var(--gray-200); display:flex; justify-content:space-between; align-items:center; gap:10px; }
.mftr-l,.mftr-r { display:flex; gap:8px; }
.mbtn { padding:8px 16px; border-radius:6px; font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; font-family:inherit; cursor:pointer; border:1px solid; transition:all .2s; }
.mbtn-ghost { background:var(--white); border-color:var(--gray-200); color:var(--gray-600); }
.mbtn-ghost:hover { border-color:var(--black); color:var(--black); }
.mbtn-mark { background:var(--gray-100); border-color:var(--gray-200); color:var(--gray-600); }
.mbtn-mark:hover { background:var(--gray-200); }
.mbtn-done { background:rgba(212,0,0,.1); border-color:rgba(212,0,0,.2); color:var(--red); }
.mbtn-done:hover { background:rgba(212,0,0,.2); }
.mbtn-edit { background:var(--black); border-color:var(--black); color:var(--white); }
.mbtn-edit:hover { background:#333; }
.mbtn-save { background:var(--red); border-color:var(--red); color:var(--white); }
.mbtn-save:hover { background:var(--red-hover); border-color:var(--red-hover); }
.mbtn-delete { background:transparent; border-color:rgba(212,0,0,.3); color:var(--red); }
.mbtn-delete:hover { background:rgba(212,0,0,.08); border-color:var(--red); }
.mbtn-create { background:var(--white); border-color:rgba(255,255,255,.35); color:var(--white); font-weight:700; padding:7px 16px; }
.mbtn-create:hover { background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.5); color:var(--white); }

/* ═══ EDIT FIELDS ═══ */
.ef { width:100%; border:1px solid var(--gray-200); border-radius:6px; padding:9px 12px; font-size:12px; font-family:inherit; color:var(--black); background:var(--white); outline:none; transition:border-color .2s; margin-bottom:8px; }
.ef:focus { border-color:var(--black); }
.ef-ta { resize:vertical; min-height:90px; line-height:1.6; }
.ef-row { display:flex; gap:8px; }
.ef-row .ef { margin-bottom:0; }

/* ═══ EMPTY ═══ */
.empty { text-align:center; padding:80px 24px; }
.empty-title { font-size:20px; font-weight:800; color:var(--black); margin-bottom:6px; }
.empty-sub { font-size:13px; color:var(--gray-400); }

/* ═══ TOAST ═══ */
.toast { position:fixed; bottom:24px; right:24px; background:var(--black); color:var(--white); padding:10px 18px; border-radius:6px; font-size:12px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; z-index:999; opacity:0; transform:translateY(8px); transition:all .25s; pointer-events:none; }
.toast.show { opacity:1; transform:translateY(0); }

/* ═══ SCROLLBAR ═══ */
::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-track { background:var(--gray-100); }
::-webkit-scrollbar-thumb { background:var(--gray-300); border-radius:3px; }

/* ═══ VIEW TOGGLE ═══ */
.view-toggle{display:flex;align-items:center;gap:4px;}
.vbtn{padding:5px 12px;border-radius:6px;border:1px solid var(--gray-200);background:var(--white);color:var(--gray-600);font-size:11px;font-weight:700;font-family:inherit;letter-spacing:.5px;cursor:pointer;transition:all .18s;white-space:nowrap;}
.vbtn:hover{border-color:var(--black);color:var(--black);}
.vbtn.active{background:var(--black);border-color:var(--black);color:var(--white);}

/* ═══ TIMELINE VIEW ═══ */
#timelineContainer{display:none;}
.tl-outer{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--gray-200);border-radius:8px;}
.tl-track{width:1440px;position:relative;}
.tl-head{display:flex;border-bottom:2px solid var(--black);}
.tl-q-seg{width:360px;flex-shrink:0;border-right:2px solid var(--black);}
.tl-q-seg:last-child{border-right:none;}
.tl-q-top{background:var(--black);padding:8px 0;text-align:center;font-size:11px;font-weight:900;color:var(--red);letter-spacing:3px;text-transform:uppercase;}
.tl-q-months{display:flex;}
.tl-month-lbl{flex:1;padding:6px 0;text-align:center;font-size:9px;font-weight:700;color:var(--gray-400);letter-spacing:1.5px;text-transform:uppercase;border-right:1px solid var(--gray-200);}
.tl-month-lbl:last-child{border-right:none;}
.tl-month-lbl.tl-cur{color:var(--red);background:rgba(212,0,0,.05);}
.tl-body{position:relative;min-height:80px;padding:8px 0 16px;}
.tl-msep{position:absolute;top:0;bottom:0;width:1px;background:var(--gray-100);pointer-events:none;z-index:1;}
.tl-qsep{position:absolute;top:0;bottom:0;width:2px;background:rgba(0,0,0,.1);pointer-events:none;z-index:1;}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--red);opacity:.85;z-index:3;pointer-events:none;}
.tl-today::before{content:'TODAY';position:absolute;top:3px;left:4px;font-size:7px;font-weight:900;color:var(--red);letter-spacing:1px;white-space:nowrap;}
.tl-row{position:relative;height:42px;}
.tl-ev{position:absolute;height:30px;border-radius:5px;padding:0 9px;display:flex;align-items:center;font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1.5px solid;transition:all .15s;z-index:2;top:6px;}
.tl-ev:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.15);z-index:5;}
.tl-ev.s-done{background:var(--gray-100);color:var(--gray-600);border-color:var(--gray-200);}
.tl-ev.s-upcoming{background:rgba(212,0,0,.08);color:var(--red);border-color:rgba(212,0,0,.2);}
.tl-ev.g-connect.s-upcoming{background:rgba(10,10,10,.06);color:var(--black);border-color:rgba(10,10,10,.15);}
.tl-ev.c-summit,.tl-ev.c-major{background:var(--black);color:var(--white);border-color:var(--black);}
.tl-ev.c-trip{background:rgba(212,0,0,.12);color:var(--red);border-color:rgba(212,0,0,.3);}
.tl-legend{display:flex;align-items:center;gap:16px;padding:10px 14px;background:var(--gray-50);border-top:1px solid var(--gray-200);border-radius:0 0 7px 7px;flex-wrap:wrap;}
.tl-lg-item{display:flex;align-items:center;gap:6px;font-size:9px;font-weight:700;color:var(--gray-600);text-transform:uppercase;letter-spacing:.5px;}
.tl-lg-dot{width:12px;height:12px;border-radius:3px;border:1.5px solid;}


/* ═══ ADMIN + LOGIN ═══ */
.admin-only{display:none!important;}
body.is-admin .admin-only{display:inline-flex!important;}
.admin-badge{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;background:rgba(22,163,74,.15);color:#16a34a;border:1px solid rgba(22,163,74,.3);padding:4px 12px;border-radius:100px;}
.login-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:300;display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .2s;backdrop-filter:blur(3px);}
.login-overlay.open{opacity:1;pointer-events:all;}
.login-box{background:var(--white);border-radius:12px;width:100%;max-width:360px;padding:32px;box-shadow:0 24px 60px rgba(0,0,0,.2);position:relative;}
.login-logo{display:flex;justify-content:center;margin-bottom:20px;}
.login-logo img{height:28px;}
.login-title{font-size:18px;font-weight:800;color:var(--black);text-align:center;margin-bottom:4px;}
.login-sub{font-size:12px;color:var(--gray-400);text-align:center;margin-bottom:24px;}
.login-label{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--gray-600);margin-bottom:5px;display:block;}
.login-input{width:100%;border:1.5px solid var(--gray-200);border-radius:7px;padding:10px 13px;font-size:13px;font-family:inherit;color:var(--black);outline:none;transition:border-color .2s;margin-bottom:14px;}
.login-input:focus{border-color:var(--black);}
.login-btn{width:100%;background:var(--black);border:none;color:var(--white);font-size:13px;font-weight:700;font-family:inherit;padding:11px;border-radius:7px;cursor:pointer;transition:background .2s;letter-spacing:.5px;}
.login-btn:hover{background:#333;}
.login-btn:disabled{background:var(--gray-300);cursor:not-allowed;}
.login-err{font-size:12px;color:var(--red);margin-top:10px;text-align:center;min-height:18px;}
.login-close{position:absolute;top:14px;right:14px;background:var(--gray-100);border:none;border-radius:6px;color:var(--gray-600);cursor:pointer;font-size:14px;padding:5px 9px;line-height:1;}
.login-close:hover{background:var(--gray-200);}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--gray-300);display:inline-block;transition:background .3s;flex-shrink:0;}
.sync-dot.saving{background:#eab308;}.sync-dot.saved{background:#16a34a;}.sync-dot.error{background:var(--red);}

@media(max-width:768px){
  .header-inner{padding:0 16px}
  .header-stats{display:none}
  .search{width:140px}
  .filter-bar{padding:0 16px}
  main{padding:20px 16px 48px}
  .event-grid{grid-template-columns:1fr}
}

// ═══════════════════════════ TIMELINE ═══════════════════════════
const TL_MW = 120; // px per month column
const TL_MO = {JAN:0,FEB:120,MAR:240,APR:360,MEI:480,JUN:600,JUL:720,AGS:840,SEPT:960,OKT:1080,NOV:1200,DES:1320};
const TL_MD = {JAN:31,FEB:28,MAR:31,APR:30,MEI:31,JUN:30,JUL:31,AGS:31,SEPT:30,OKT:31,NOV:30,DES:31};

function tlPx(e) {
  const off = TL_MO[e.month] ?? 0;
  const day = e.date ? new Date(e.date + 'T00:00:00').getDate() : 1;
  return off + (day - 1) / (TL_MD[e.month] || 30) * TL_MW;
}

function tlWpx(e) {
  const m = (e.dateDisplay || '').match(/(\d+)[–\-](\d+)/);
  const dur = m ? Math.max(1, parseInt(m[2]) - parseInt(m[1]) + 1) : 1;
  return Math.max(106, dur / (TL_MD[e.month] || 30) * TL_MW);
}

function tlTodayPx() {
  const t = new Date();
  const ms = ['JAN','FEB','MAR','APR','MEI','JUN','JUL','AGS','SEPT','OKT','NOV','DES'][t.getMonth()];
  return (TL_MO[ms] || 0) + (t.getDate() - 1) / (TL_MD[ms] || 30) * TL_MW;
}

function tlPackRows(evts) {
  const GAP = 8;
  const rows = [], ends = [];
  evts.forEach(e => {
    const sx = tlPx(e), wx = tlWpx(e), ex = sx + wx + GAP;
    let r = ends.findIndex(end => sx >= end);
    if (r === -1) { r = rows.length; rows.push([]); ends.push(0); }
    rows[r].push({...e, sx, wx});
    ends[r] = ex;
  });
  return rows;
}

function renderTimeline(f) {
  const el = document.getElementById('timelineContainer');
  const curM = getActiveMonth();
  const qcfg = [
    {q:'Q1', months:['JAN','FEB','MAR']},
    {q:'Q2', months:['APR','MEI','JUN']},
    {q:'Q3', months:['JUL','AGS','SEPT']},
    {q:'Q4', months:['OKT','NOV','DES']}
  ];

  const head = `<div class="tl-head">${qcfg.map(({q, months}) =>
    `<div class="tl-q-seg"><div class="tl-q-top">${q}</div><div class="tl-q-months">${
      months.map(m => `<div class="tl-month-lbl${m === curM ? ' tl-cur' : ''}">${m}</div>`).join('')
    }</div></div>`).join('')}</div>`;

  // Vertical separator lines
  const seps =
    [120,240,480,600,840,960,1200,1320].map(x => `<div class="tl-msep" style="left:${x}px"></div>`).join('') +
    [360,720,1080].map(x => `<div class="tl-qsep" style="left:${x}px"></div>`).join('');

  const todayX = tlTodayPx();
  const todayEl = `<div class="tl-today" style="left:${todayX.toFixed(1)}px"></div>`;

  const sorted = [...f].sort((a, b) => a.date.localeCompare(b.date));
  const rows = tlPackRows(sorted);

  const pills = rows.map(row =>
    `<div class="tl-row">${row.map(e => {
      let cls = `s-${e.status.toLowerCase()}`;
      if (e.group === 'Connect') cls += ' g-connect';
      if (e.category === 'SUMMIT') cls += ' c-summit';
      else if (e.category === 'MAJOR EVENT') cls += ' c-major';
      else if (e.category === 'TRIP') cls += ' c-trip';
      const tip = `${e.name} — ${e.dateDisplay} ${e.monthFull} 2026 · ${e.category}${e.pic !== '—' ? ' · ' + e.pic : ''}`.replace(/"/g, '&quot;');
      const label = `${e.dateDisplay} ${e.name}`;
      return `<div class="tl-ev ${cls}" style="left:${e.sx.toFixed(1)}px;width:${e.wx.toFixed(1)}px" onclick="openModal(${e.id})" title="${tip}">${label}</div>`;
    }).join('')}</div>`
  ).join('');

  const legend = `<div class="tl-legend">
    <div class="tl-lg-item"><div class="tl-lg-dot" style="background:rgba(212,0,0,.08);border-color:rgba(212,0,0,.2)"></div>Upcoming</div>
    <div class="tl-lg-item"><div class="tl-lg-dot" style="background:var(--gray-100);border-color:var(--gray-200)"></div>Done</div>
    <div class="tl-lg-item"><div class="tl-lg-dot" style="background:rgba(212,0,0,.12);border-color:rgba(212,0,0,.3)"></div>Trip</div>
    <div class="tl-lg-item"><div class="tl-lg-dot" style="background:var(--black);border-color:var(--black)"></div>Summit / Major</div>
    <div class="tl-lg-item"><div class="tl-lg-dot" style="background:rgba(10,10,10,.06);border-color:rgba(10,10,10,.15)"></div>Connect</div>
    <div class="tl-lg-item" style="margin-left:auto;color:var(--red)">▎ Garis merah = hari ini &nbsp;·&nbsp; Klik event untuk edit</div>
  </div>`;

  el.innerHTML = `<div class="tl-outer"><div class="tl-track">${head}<div class="tl-body">${seps}${todayEl}${pills}</div></div>${legend}</div>`;
}

// ═══════════════════════════ FILTER ═══════════════════════════
function setFilter(type, val, el) {
  if(type==='q') { filterQ=val; document.querySelectorAll('[id^="fq-"]').forEach(b=>b.classList.remove('active')); el.classList.add('active'); }
  if(type==='s') { filterS=val; document.querySelectorAll('[id^="fs-"]').forEach(b=>b.classList.remove('active')); el.classList.add('active'); }
  if(type==='g') { filterG=val; document.querySelectorAll('[id^="fg-"]').forEach(b=>{ b.classList.remove('active'); b.style.removeProperty('background'); b.style.removeProperty('color'); b.style.removeProperty('border-color'); }); el.classList.add('active'); if(val==='Ignite') { el.style.background='var(--red)'; el.style.color='white'; el.style.borderColor='var(--red)'; } }
  render();
}

function getFiltered() {
  return events.filter(e => {
    if(filterQ !== 'ALL' && e.q !== filterQ) return false;
    if(filterS !== 'all' && e.status.toLowerCase() !== filterS) return false;
    if(filterG !== 'ALL' && (e.group||'—') !== filterG) return false;
    if(searchQ) {
      const q = searchQ.toLowerCase();
      if(![e.name,e.category,e.pic,e.month,e.q,(e.group||'')].some(v => v.toLowerCase().includes(q))) return false;
    }
    return true;
  });
}

// ═══════════════════════════ RENDER ═══════════════════════════
function render() {
  const f = getFiltered();
  const total = events.length;
  const done = events.filter(e=>e.status==='Done').length;
  const upcoming = events.filter(e=>e.status==='Upcoming').length;
  const pct = total ? Math.round(done/total*100) : 0;

  // Stats
  document.getElementById('statsBar').innerHTML = `
    <div class="hstat"><div class="hstat-num">${total}</div><div class="hstat-label">Total Events</div></div>
    <div class="hstat"><div class="hstat-num gray">${done}</div><div class="hstat-label">Done</div></div>
    <div class="hstat"><div class="hstat-num red">${upcoming}</div><div class="hstat-label">Upcoming</div></div>
    <div class="hstat"><div class="hstat-num">${pct}%</div><div class="hstat-label">Progress</div></div>`;
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('countLabel').textContent = f.length + ' event ditampilkan';

  // Timeline strip
  const quarters = [{q:'Q1',months:['JAN','FEB','MAR']},{q:'Q2',months:['APR','MEI','JUN']},{q:'Q3',months:['JUL','AGS','SEPT']},{q:'Q4',months:['OKT','NOV','DES']}];
  document.getElementById('timelineStrip').innerHTML = quarters.map(({q,months}) => {
    const monthBtns = months.map(m => {
      const cnt = events.filter(e=>e.month===m).length;
      return `<button class="tmonth${m===getActiveMonth()?' active':''} ${cnt>0?'has-events':''}" onclick="scrollToMonth('${m}')">${m}<span class="dot-count"></span></button>`;
    }).join('');
    return `<div class="tq-group"><div class="tq-label">${q}</div><div class="tmonths">${monthBtns}</div></div>`;
  }).join('');

  // Content
  const container = document.getElementById('eventsContainer');
  const tlContainer = document.getElementById('timelineContainer');
  const empty = document.getElementById('emptyState');

  if (currentView === 'timeline') {
    container.style.display = 'none';
    tlContainer.style.display = 'block';
    if (!f.length) { tlContainer.innerHTML = ''; empty.style.display = 'block'; return; }
    empty.style.display = 'none';
    renderTimeline(f);
    return;
  }

  container.style.display = '';
  tlContainer.style.display = 'none';
  if(!f.length) { container.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';

  const quarters2 = ['Q1','Q2','Q3','Q4'];
  let html = '';
  quarters2.forEach(q => {
    const qEvents = f.filter(e=>e.q===q);
    if(!qEvents.length) return;
    const qTotal = qEvents.length;
    const qDone = qEvents.filter(e=>e.status==='Done').length;
    html += `<div class="q-section" id="section-${q}">
      <div class="q-header">
        <div class="q-num">${q}</div>
        <div class="q-detail">
          <div class="q-period">${QUARTER_LABELS[q]}</div>
          <div class="q-title">2026 Special Event Calendar</div>
        </div>
        <div class="q-right">
          <span class="q-badge q-badge-done">${qDone} Done</span>
          <span class="q-badge q-badge-total">${qTotal} Events</span>
        </div>
      </div>`;

    const monthsInQ = [...new Set(qEvents.map(e=>e.month))].sort((a,b)=>MONTHS_ORDER.indexOf(a)-MONTHS_ORDER.indexOf(b));
    monthsInQ.forEach(m => {
      const mEvents = qEvents.filter(e=>e.month===m).sort((a,b)=>a.date.localeCompare(b.date));
      html += `<div id="month-${m}">
        <div class="month-divider">
          <div class="month-name">${MONTHS_FULL[m]||m}</div>
          <div class="month-line"></div>
          <div class="month-count">${mEvents.length} event</div>
        </div>
        <div class="event-grid">${mEvents.map(eventCard).join('')}</div>
      </div>`;
    });
    html += '</div>';
  });
  container.innerHTML = html;
}

function groupBadgeClass(g) {
  if(g==='Ignite') return 'gbadge-ignite';
  if(g==='Connect') return 'gbadge-connect';
  return 'gbadge-none';
}
function groupCardClass(g) {
  if(g==='Ignite') return 'grp-ignite';
  if(g==='Connect') return 'grp-connect';
  return 'grp-none';
}

function eventCard(e) {
  const sc = e.status.toLowerCase();
  const catClass = CAT_CLASS[e.category] || '';
  const grp = e.group || '—';
  const gc = groupCardClass(grp);
  const gbc = groupBadgeClass(grp);
  const gLabel = grp === '—' ? 'Belum' : grp;

      <div class="ecard-date">
        <div class="ecard-day">${e.dateDisplay}</div>

      <div class="ecard-tags">

}

  document.getElementById('btnDelete').style.display = isAdmin ? 'inline-flex' : 'none';
  document.getElementById('btnEdit').style.display = isAdmin ? 'inline-flex' : 'none';
  document.getElementById('btnEdit').textContent = isEditing ? 'Batal' : 'Edit';
  document.getElementById('btnSave').style.display = (isAdmin && isEditing) ? 'inline-flex' : 'none';
  document.getElementById('btnSave').textContent = 'Simpan';
  isEditing ? buildEditForm() : buildViewBody();
}

function buildViewBody() {
  const e = curEvent;
  const grp = e.group || '—';
  const gbc = groupBadgeClass(grp);
  const gLabel = grp === '—' ? 'Belum Ditandai' : grp;
  const groupRow = isAdmin
    ? `<div class="group-assign">
        <span class="group-assign-label">Kelompok Acara</span>
        <select class="group-sel" onchange="setGroup(this.value)">
          <option value="—"${grp==='—'?' selected':''}>— Belum Ditandai</option>
          <option value="Ignite"${grp==='Ignite'?' selected':''}>🔴 Ignite</option>
          <option value="Connect"${grp==='Connect'?' selected':''}>⚫ Connect</option>
        </select>
      </div>`
    : `<div style="display:flex;align-items:center;gap:8px;margin-bottom:16px">
        <span style="font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray-400)">Kelompok:</span>
        <span class="gbadge ${gbc}">${gLabel}</span>
      </div>`;
  const momentumRow = isAdmin
    ? `<div class="m-sec">Momentum Pengumuman</div>
       <textarea class="momentum-ta" id="momentumInput" placeholder="Tulis momentum / pengumuman penting untuk event ini..." onblur="saveMomentum(this.value)">${e.momentum||''}</textarea>
       <div class="momentum-hint">Teks ini langsung tampil di card depan saat diisi. Klik di luar kotak untuk menyimpan.</div>`
    : (e.momentum ? `<div class="ecard-momentum">📢 ${e.momentum}</div>` : '');
  document.getElementById('mBody').innerHTML = groupRow + momentumRow + `
    <div class="m-sec">Deskripsi</div>
    <div class="m-desc">${e.desc}</div>
    <div class="m-sec">Agenda</div>
    <ul class="m-list">${e.agenda.map((a,i)=>`<li><span class="m-num">${i+1}</span><span>${a}</span></li>`).join('')}</ul>
    <div class="m-sec">Tujuan</div>
    <ul class="m-list" style="margin-bottom:16px">${e.tujuan.map((t,i)=>`<li><span class="m-num">${i+1}</span><span>${t}</span></li>`).join('')}</ul>
    ${e.notes?`<div class="m-sec">Catatan</div><div class="m-note">${e.notes}</div>`:''}`;
}

function saveMomentum(val) {
  const i = events.findIndex(e=>e.id===curEvent.id);
  events[i].momentum = val.trim(); curEvent = events[i];
  persist(); render();
}

function setGroup(val) {
  const i = events.findIndex(e=>e.id===curEvent.id);
  events[i].group = val; curEvent = events[i];
  persist(); buildModal(); render();
}

const MONTH_OPTS = ['JAN','FEB','MAR','APR','MEI','JUN','JUL','AGS','SEPT','OKT','NOV','DES'];
const MONTH_FULL_MAP = {JAN:'Januari',FEB:'Februari',MAR:'Maret',APR:'April',MEI:'Mei',JUN:'Juni',JUL:'Juli',AGS:'Agustus',SEPT:'September',OKT:'Oktober',NOV:'November',DES:'Desember'};
const CAT_OPTS = ['BOP','SPECIAL MONDAY','ROAD TO IDEASCAPE','LEADERS MEETING','TRIP','OUTING','CORE','ROAD TO AAB','MAJOR EVENT','SUMMIT','SPORT'];

function dateToMeta(dateStr) {
  if(!dateStr) return {q:'Q1',month:'JAN',dateDisplay:'',monthFull:'Januari'};
  const d = new Date(dateStr + 'T00:00:00');
  const mi = d.getMonth();
  const months  = ['JAN','FEB','MAR','APR','MEI','JUN','JUL','AGS','SEPT','OKT','NOV','DES'];
  const mFulls  = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const qs      = ['Q1','Q1','Q1','Q2','Q2','Q2','Q3','Q3','Q3','Q4','Q4','Q4'];
  return { q:qs[mi], month:months[mi], dateDisplay:String(d.getDate()), monthFull:mFulls[mi] };
}

function previewDate() {
  const val = document.getElementById('eDate').value;
  const el  = document.getElementById('dateDerived');
  const dispEl = document.getElementById('eDisplay');
  if(!el) return;
  if(val) {
    const m = dateToMeta(val);
    el.textContent = `→ ${m.q}  ·  ${m.monthFull}  ·  ${m.dateDisplay}`;
    el.style.display = 'block';
    if(dispEl && !dispEl.value) dispEl.value = m.dateDisplay;
  } else {
    el.textContent = '';
    el.style.display = 'none';
  }
}

function saveNewEvent() {
  const name = document.getElementById('eName').value.trim();
  const dateVal = document.getElementById('eDate').value;
  if(!name) { showToast('Nama event wajib diisi'); return; }
  if(!dateVal) { showToast('Tanggal wajib diisi'); return; }
  const meta = dateToMeta(dateVal);
  const displayVal = document.getElementById('eDisplay').value.trim() || meta.dateDisplay;
  const newId = events.length ? Math.max(...events.map(e=>e.id)) + 1 : 1;
  const newEvent = {
    id: newId,
    q: meta.q, month: meta.month, monthFull: meta.monthFull,
    date: dateVal,
    dateDisplay: displayVal,
    name,
    category: document.getElementById('eCat').value,
    pic: document.getElementById('ePIC').value.trim() || '—',
    group: document.getElementById('eGroup').value,
    status: document.getElementById('eStat').value,
    momentum: document.getElementById('eMomentum').value.trim(),
    desc: document.getElementById('eDesc').value.trim(),
    agenda: document.getElementById('eAgenda').value.split('\n').map(l=>l.trim()).filter(Boolean),
    tujuan: document.getElementById('eTujuan').value.split('\n').map(l=>l.trim()).filter(Boolean),
    notes: document.getElementById('eNotes').value.trim()
  };
  events.push(newEvent);
  persist(); closeModal(); render();
  showToast('Event berhasil dibuat');
}

function toggleEdit() { isEditing = !isEditing; buildModal(); }
function markDone() {
  const i = events.findIndex(e=>e.id===curEvent.id);
  events[i].status = 'Done'; curEvent = events[i];
  persist(); buildModal(); render();
}
function saveEdit() {
  if(isCreating) { saveNewEvent(); return; }
  const i = events.findIndex(e=>e.id===curEvent.id);
  events[i].name = document.getElementById('eName').value.trim();
  const newDate = document.getElementById('eDate').value;
  if(newDate) {
    const m = dateToMeta(newDate);
    events[i].date = newDate;
    events[i].q = m.q;
    events[i].month = m.month;
    events[i].monthFull = m.monthFull;
    const disp = document.getElementById('eDisplay').value.trim();
    events[i].dateDisplay = disp || m.dateDisplay;
  } else {
    events[i].dateDisplay = document.getElementById('eDisplay').value.trim();
  }
  events[i].status = document.getElementById('eStat').value;
  events[i].group = document.getElementById('eGroup').value;
  events[i].pic = document.getElementById('ePIC').value.trim();
  events[i].desc = document.getElementById('eDesc').value.trim();
  events[i].agenda = document.getElementById('eAgenda').value.split('\n').map(l=>l.trim()).filter(Boolean);
  events[i].tujuan = document.getElementById('eTujuan').value.split('\n').map(l=>l.trim()).filter(Boolean);
  events[i].notes = document.getElementById('eNotes').value.trim();
  events[i].momentum = document.getElementById('eMomentum').value.trim();
  curEvent = events[i]; isEditing = false;
  persist(); buildModal(); render();
}

// ═══════════════════════════ EXPORT ═══════════════════════════
function exportCSV() {
  const h = ['ID','Q','MONTH','DATE','NAME','CATEGORY','PIC','STATUS','DESC'];
  const rows = events.map(e=>[e.id,e.q,e.month,e.date,e.name,e.category,e.pic,e.status,e.desc].map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(','));
  const blob = new Blob([[h.join(','),...rows].join('\n')],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='ignitex-special-2026.csv'; a.click();
}

// ═══════════════════════════ TOAST ═══════════════════════════
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'),2000);
}


// ═══════════════════════════ ADMIN AUTH ═══════════════════════════
function activateAdmin(notify = true) {
  isAdmin = true;
  document.body.classList.add('is-admin');
  document.getElementById('btnLogin').style.display   = 'none';
  document.getElementById('btnLogout').style.display  = 'inline-flex';
  document.getElementById('adminBadge').style.display = 'inline-flex';
  if (notify) showToast('✔ Login berhasil — mode Admin aktif');
  render();
}
function doLogout() {
  isAdmin = false; adminPass = '';
  sessionStorage.removeItem('igx_pass');
  document.body.classList.remove('is-admin');
  document.getElementById('btnLogin').style.display   = 'inline-flex';
  document.getElementById('btnLogout').style.display  = 'none';
  document.getElementById('adminBadge').style.display = 'none';
  if (isEditing || isCreating) closeModal();
  showToast('✔ Logged out');
  render();
}
async function doLogin() {
  const pass = document.getElementById('loginPassword').value.trim();
  const btn  = document.getElementById('btnLoginSubmit');
  const err  = document.getElementById('loginErr');
  err.textContent = '';
  if (!pass) { err.textContent = 'Masukkan password'; return; }
  btn.disabled = true; btn.textContent = 'Memverifikasi...';
  try {
    const res = await fetch('/api/events', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Password': pass },
      body: JSON.stringify(events)
    });
    btn.disabled = false; btn.textContent = 'Login';
    if (res.status === 401) { err.textContent = 'Password salah'; return; }
    if (!res.ok) { err.textContent = 'Error server, coba lagi'; return; }
    adminPass = pass;
    sessionStorage.setItem('igx_pass', pass);
    closeLoginModal();
    activateAdmin(true);
  } catch(_) { btn.disabled = false; btn.textContent = 'Login'; err.textContent = 'Koneksi error'; }
}
function openLoginModal() {
  document.getElementById('loginOverlay').classList.add('open');
  document.getElementById('loginPassword').value = '';
  document.getElementById('loginErr').textContent = '';
  setTimeout(() => document.getElementById('loginPassword').focus(), 100);
}
function closeLoginModal() { document.getElementById('loginOverlay').classList.remove('open'); }
function handleLoginOverlayClick(e) { if (e.target === document.getElementById('loginOverlay')) closeLoginModal(); }

// ═══════════════════════════ KEYS & EVENTS ═══════════════════════════
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });
document.getElementById('searchInput').addEventListener('input', e => { searchQ = e.target.value; render(); });

// ═══════════════════════════ INIT ═══════════════════════════
load(); render();
// Restore admin session if password saved
(async () => {
  const saved = sessionStorage.getItem('igx_pass');
  if (!saved) return;
  try {
    const res = await fetch('/api/events', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Password': saved },
      body: JSON.stringify(events)
    });
    if (res.ok) { adminPass = saved; activateAdmin(false); }
    else sessionStorage.removeItem('igx_pass');
  } catch(_) {}
})();
